# Role families offlist looks for.
#
# Each family has:
#   name        shown on the site
#   what        plain English: what the job actually is
#   why         why an Information Systems / business grad fits
#   titles      phrases matched against job titles (case insensitive, substring)
#   search      extra search words used for Workday sites (they need a search term)
#
# To add a role: add a phrase to `titles` in the right family, or add a new family.

families:
  - id: revops
    name: Sales & Revenue Operations
    what: >
      The team behind the sales team. You keep the CRM clean, build reports and
      dashboards on the pipeline, set up territories and quotas, and fix the
      processes that slow sellers down. You support sales without carrying a quota.
    why: >
      Uses Excel, CRM tools, and reporting from an IS degree plus an understanding
      of how selling works. Sales experience is a real advantage here.
    titles:
      - sales operations
      - sales ops
      - revenue operations
      - revops
      - gtm operations
      - go-to-market operations
      - commercial operations
      - deal desk
      - sales enablement
      - sales analyst
      - pricing analyst
      - partner operations
      - channel operations
      - sales support
      - sales coordinator
      - order management
    search: [sales operations, revenue operations, sales analyst, deal desk, enablement, pricing analyst]

  - id: systems
    name: Business Systems & CRM Admin
    what: >
      You run the software a company uses every day (Salesforce, HubSpot, an ERP
      like SAP, an HR system like Workday). You gather what people need, change
      settings, build fields and reports, test updates, and train users. Mostly
      configuration, not coding.
    why: >
      This is what Systems Analysis and Design and Information Systems Management
      courses are built for.
    titles:
      - business systems analyst
      - business systems associate
      - business applications analyst
      - systems analyst
      - crm administrator
      - crm analyst
      - crm specialist
      - salesforce administrator
      - salesforce admin
      - salesforce analyst
      - hubspot
      - erp analyst
      - sap analyst
      - it business analyst
      - hris analyst
      - hris specialist
      - application analyst
      - applications analyst
      - systems administrator
    search: [business systems, salesforce, crm, systems analyst, erp, hris, application analyst]

  - id: deployment
    name: Deployment Strategy
    anywhere: true   # mostly in New York and San Francisco, so these show wherever they are
    what: >
      You embed with a customer, learn how their business runs, and roll out the
      company's software (often AI) so it actually gets used. You run the project,
      shape the workflows, and train the people. It is the non coding partner of a
      Forward Deployed Engineer.
    why: >
      Mixes customer skills from sales with systems thinking from an IS degree.
      The best path toward Forward Deployed Engineer before you can code.
    titles:
      - deployment strategist
      - ai deployment
      - implementation strategist
      - forward deployed strategist
      - deployment strategy
    search: [deployment strategist]

  - id: implementation
    name: Implementation & Onboarding
    what: >
      When a company buys software, you get them set up: learn what they need,
      configure the product, move their data over, and train their team. Project
      work with customers, usually with heavy training at the start.
    why: >
      Mixes technical setup with talking to customers, so it rewards both an IS
      background and sales or service experience.
    titles:
      - implementation
      - onboarding specialist
      - onboarding consultant
      - onboarding analyst
      - deployment specialist
      - customer deployment
      - solutions consultant
      - solution consultant
      - solution advisor
      - professional services
      - technical consultant
      - technology consultant
      - associate consultant
      - customer training
      - training specialist
      - product specialist
      - client product specialist
    search: [implementation, onboarding, solutions consultant, technical consultant, deployment, training specialist]

  - id: success
    name: Customer Success & Tech Support
    what: >
      You keep customers happy after the sale: answer questions, solve problems,
      run check ins, and help them get value from the product so they renew.
      Support roles troubleshoot issues and escalate the hard ones.
    why: >
      Customer facing work where explaining technical things clearly matters more
      than coding.
    titles:
      - customer success
      - client success
      - customer support analyst
      - customer support specialist
      - technical support
      - product support
      - application support
      - support specialist
      - support analyst
      - client solutions
      - client services
      - account coordinator
      - technical account
      - customer experience analyst
      - renewals
    search: [customer success, client success, technical support, product support, client solutions, account coordinator]

  - id: analyst
    name: Business & Operations Analyst
    what: >
      You turn data into decisions: pull numbers, build reports and dashboards,
      spot problems, and recommend fixes for operations, supply chain,
      marketing, or the business overall.
    why: >
      Excel, Tableau, data mining, and operations coursework line up directly.
    titles:
      - business analyst
      - business operations
      - operations analyst
      - data analyst
      - reporting analyst
      - business intelligence analyst
      - bi analyst
      - supply chain analyst
      - procurement analyst
      - inventory analyst
      - demand planner
      - marketing operations
      - marketing analyst
      - product operations
      - support operations
      - workforce management
      - strategy analyst
      - associate analyst
      - analyst i
      - junior analyst
    search: [business analyst, operations analyst, data analyst, reporting analyst, supply chain analyst, marketing operations, junior analyst]

  - id: programs
    name: Rotational & Trainee Programs
    what: >
      Structured new grad programs that rotate you through departments and train
      you for management or a specialty. Built for people with little experience.
    why: >
      Designed for graduating seniors. Your degree and any work experience count.
    titles:
      - management trainee
      - leadership development
      - development program
      - rotational
      - trainee
      - early career
      - new grad
      - graduate program
      - associate program
      - academy
    search: [trainee, rotational, development program, leadership development, early career, new grad, junior]

# Titles containing any of these are dropped (too senior, not a job, or not a fit).
exclude_titles:
  - senior
  - "sr."
  - "sr "
  - lead
  - manager
  - director
  - principal
  - staff
  - head of
  - vice president
  - " vp"
  - chief
  - architect
  - product owner
  - product manager
  - program manager
  - " ii"
  - " iii"
  - " iv"
  - " 2"
  - " 3"
  - intern
  - internship
  - co-op
  - coop
  - engineer
  - developer
  - scientist
  - attorney
  - counsel
  - paralegal
  - fixed term
  - nurse
  - part-time
  - part time
  - temporary
  - seasonal
  # quota-carrying sales jobs (sales operations and sales support stay in)
  - sales representative
  - sales rep
  - account executive
  - business development
  - sales development
  - inside sales
  - outside sales
  - sales associate
  - sales consultant
  - sales trainee
  - sales rotational
  - sales specialist
  - sales executive
  - relationship development
  - sales talent
  - territory

# Anything asking for more years than this gets a red flag on the site.
max_years_ok: 0
