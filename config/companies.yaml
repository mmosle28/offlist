# Companies offlist checks every day.
#
# Add a company with ONE of these:
#   url:    paste the company's careers page link. Works for Greenhouse, Lever, Ashby,
#           SmartRecruiters and Workday links (myworkdayjobs.com). Easiest option.
#   guess:  a short name, or a list of names to try, e.g. [flocksafety, flock].
#           offlist tries each on Greenhouse, Lever, Ashby and SmartRecruiters and
#           remembers whichever works.
#   greenhouse / lever / ashby / smartrecruiters: the board name, if you know it.
#   manual: a careers link for a company whose system offlist can't read yet.
#           It shows on the site's Companies tab as a link to check by hand.
#
# Companies that fail show up on the Companies tab so they can be fixed.

