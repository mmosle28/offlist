name: Update jobs

on:
  schedule:
    - cron: "23 10 * * *"   # every day around 5-6am Eastern
  workflow_dispatch:         # "Run workflow" button in the Actions tab
  push:
    paths:
      - "config/**"
      - "offlist/**"

permissions:
  contents: write

concurrency:
  group: update-jobs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Tests
        run: python -m unittest -v
      - name: Fetch jobs
        run: python -m offlist.run
      - name: Save results
        run: |
          git config user.name "offlist-bot"
          git config user.email "offlist-bot@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update jobs $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi
